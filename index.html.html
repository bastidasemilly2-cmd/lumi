<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#5B2DD9">
<title>LUMI</title><!-- v2: perfiles Isabela, Ismael, Alejandro, Santiago, Mateo; ajuste iPhone -->
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F0FF;--panel:#fff;--ink:#1A1440;--mute:#6E6A94;--line:#E2DCFA;--v:#7B4DFF;--b:#3A6BFF;--c:#5CC8FF;--grad:linear-gradient(135deg,#8A4DFF,#3A6BFF);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C0920;--panel:#16113A;--ink:#F1EEFF;--mute:#9A94C7;--line:#2A2358}}
:root[data-theme="dark"]{--bg:#0C0920;--panel:#16113A;--ink:#F1EEFF;--mute:#9A94C7;--line:#2A2358}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Sora',system-ui,sans-serif;height:100dvh;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
.app{width:100%;height:100dvh;background:var(--panel);display:flex;flex-direction:column;overflow:hidden;position:relative}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 22px 8px}
.logo{font-weight:800;font-size:28px;letter-spacing:.06em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.bell{position:relative;background:none;border:0;font-size:22px;cursor:pointer;color:var(--ink)}
.dot{position:absolute;top:-4px;right:-6px;background:#FF4D8D;color:#fff;font-size:10px;font-weight:600;min-width:17px;height:17px;border-radius:9px;display:none;align-items:center;justify-content:center}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;padding:6px 16px 10px;flex-direction:column}
.view.on{display:flex}
.stack{flex:1;position:relative;margin:4px 0 12px}
.card{position:absolute;inset:0;border-radius:26px;overflow:hidden;touch-action:none;cursor:grab;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;user-select:none;transition:transform .35s,opacity .35s}
.card.back{transform:scale(.94) translateY(12px);opacity:.7}
.card .ini{position:absolute;top:18%;left:50%;transform:translateX(-50%);font-size:110px;font-weight:800;opacity:.25}
.shade{background:linear-gradient(transparent,rgba(12,9,32,.88));padding:60px 20px 18px}
.shade h2{font-size:26px;font-weight:800}.shade h2 span{font-weight:400}
.shade p{font-size:14px;margin:6px 0 10px;opacity:.9;line-height:1.4}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags i{font-style:normal;font-size:12px;padding:5px 11px;border-radius:14px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.stamp{position:absolute;top:28px;font-size:26px;font-weight:800;border:4px solid;border-radius:12px;padding:2px 12px;opacity:0;transform:rotate(-12deg)}
.stamp.l{left:20px;color:#7DFFB3;border-color:#7DFFB3}.stamp.n{right:20px;color:#FF7DA8;border-color:#FF7DA8;transform:rotate(12deg)}
.acts{display:flex;justify-content:center;gap:18px;padding:4px 0 6px}
.acts button{width:60px;height:60px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:24px;cursor:pointer;color:var(--ink);transition:transform .15s}
.acts button:active{transform:scale(.9)}
.acts .like{background:var(--grad);border:0;color:#fff;width:68px;height:68px;box-shadow:0 8px 22px rgba(90,60,255,.45)}
.acts .star{color:var(--c)}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;pointer-events:none}.av{position:relative;overflow:hidden}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}.empty{margin:auto;text-align:center;color:var(--mute);line-height:1.5;padding:20px}
nav{display:flex;border-top:1px solid var(--line);padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav button{flex:1;background:none;border:0;color:var(--mute);font:600 12px 'Sora',sans-serif;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center}
nav button span{font-size:22px}nav button.on{color:var(--v)}
h3{font-size:18px;margin:8px 4px 10px}
.list{overflow:auto;flex:1}
.row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line)}
.av{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex:none}
.row div.t{flex:1;font-size:14px}.row small{color:var(--mute);display:block;margin-top:2px}
.row button{border:0;background:var(--grad);color:#fff;font:600 13px 'Sora',sans-serif;padding:8px 14px;border-radius:18px;cursor:pointer}
.me{text-align:center;padding-top:14px}.me .av{width:104px;height:104px;font-size:40px;margin:0 auto 12px;border:4px solid var(--panel);box-shadow:0 0 0 3px var(--v)}
.me p{color:var(--mute);font-size:14px;margin:6px 20px 14px;line-height:1.5}
.me .tags i{background:var(--bg);color:var(--ink);border:1px solid var(--line)}.me .tags{justify-content:center}
.toast{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:12px;right:12px;background:var(--grad);color:#fff;border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:13px;transform:translateY(-120px);transition:transform .4s;z-index:5;box-shadow:0 10px 30px rgba(60,60,220,.4)}
.toast.show{transform:none}
.match{position:absolute;inset:0;z-index:9;background:linear-gradient(160deg,#5B2DD9,#1E3FBF);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:14px}
.match.on{display:flex}.match h1{font-size:38px;font-weight:800}
.pair{display:flex}.pair .av{width:92px;height:92px;font-size:34px;border:4px solid #fff}.pair .av+.av{margin-left:-18px}
.match button{border:0;border-radius:26px;padding:14px 30px;font:600 15px 'Sora',sans-serif;cursor:pointer}
.match .a{background:#fff;color:#3A2DB5}.match .b{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
button:focus-visible{outline:3px solid var(--c);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="app">
<div class="toast" id="toast"></div>
<header><div class="logo">LUMI</div><button class="bell" id="bell" aria-label="Notificaciones">🔔<span class="dot" id="dot"></span></button></header>
<main>
<section class="view on" id="v-d"><div class="stack" id="stack"></div>
<div class="acts"><button id="bn" aria-label="Pasar">✕</button><button class="star" id="bs" aria-label="Super like">★</button><button class="like" id="bl" aria-label="Me gusta">♥</button></div></section>
<section class="view" id="v-l"><h3>Les gustas</h3><div class="list" id="likes"></div></section>
<section class="view" id="v-m"><h3>Tus matches</h3><div class="list" id="matches"></div></section>
<section class="view" id="v-p"><div class="me"><div id="meav"></div><h2>Isabela</h2><p>Cuéntale a LUMI quién eres: una frase, tus gustos y lo que buscas.</p><div class="tags"><i>Música</i><i>Café</i><i>Viajes</i><i>Cine</i></div></div></section>
</main>
<nav>
<button class="on" data-v="d"><span>✦</span>Descubrir</button>
<button data-v="l"><span>♥</span>Les gustas</button>
<button data-v="m"><span>💬</span>Matches</button>
<button data-v="p"><span>◉</span>Perfil</button>
</nav>
<div class="match" id="match"><h1>¡Es un match!</h1><p id="mt"></p><div class="pair" id="pair"></div><button class="a" id="ms">Enviar mensaje</button><button class="b" id="mk">Seguir deslizando</button></div>
</div>
